<fieldset class="edit-section-fieldset">
  <legend>📝 HTML Editor</legend>
  <!-- Include other HTML elements that make up your form or display -->
  @if (!isPreviewMode) {
    <app-editor [apiUrl]="apiUrl" (goToPreview)="goToPreview()"></app-editor>
  }
  @if (isPreviewMode) {
    <app-preview [content]="content" (closePreview)="backToEditor()"></app-preview>
  }
</fieldset>
